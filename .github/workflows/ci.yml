name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['18', 'lts/*']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm test

  evals:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment: evals
    timeout-minutes: 30
    concurrency:
      group: evals-${{ github.ref }}
      cancel-in-progress: true
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_VERSION: '2.1.306'
    steps:
      - name: Skip when ANTHROPIC_API_KEY is not set
        if: ${{ env.ANTHROPIC_API_KEY == '' }}
        run: echo "ANTHROPIC_API_KEY secret is not set; skipping plugin evals."
      - uses: actions/checkout@v4
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        with:
          persist-credentials: false
      - name: Install sandbox prerequisites
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap socat
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Install Claude Code
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s "$CLAUDE_CODE_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run plugin evals
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        run: >-
          claude plugin eval
          --trust-plugin
          --scaffold
          --allow-tools "Bash(claudeflare *)" Write
          --model claude-opus-5-5
          --judge-model claude-opus-5-5
          --threshold 0.8
          --max-cost-usd 15
          --no-publish
          --json eval-results.json
      - name: Summarize eval results
        if: ${{ always() && env.ANTHROPIC_API_KEY != '' && hashFiles('eval-results.json') != '' }}
        run: |
          node -e '
            const fs = require("node:fs");
            const data = JSON.parse(fs.readFileSync("eval-results.json", "utf8"));
            const threshold = data.suite?.threshold;
            const cases = (data.cases ?? []).map((c) => ({
              name: c.name,
              score: c.aggregates?.score ?? null,
              pass_rate: c.aggregates?.passRate ?? null,
              passed: typeof c.aggregates?.score === "number" && typeof threshold === "number" && c.aggregates.score >= threshold,
            }));
            const summary = { threshold, cost_usd: data.costUsd ?? null, partial: data.partial ?? null, aggregates: data.aggregates ?? null, cases };
            fs.writeFileSync("eval-summary.json", JSON.stringify(summary, null, 2) + "\n");
          '
      - name: Upload eval summary
        if: ${{ always() && env.ANTHROPIC_API_KEY != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: eval-summary
          path: eval-summary.json
          retention-days: 7
          if-no-files-found: warn
